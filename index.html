  <!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHU Multi Manpower Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #004aad; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f4f8; }
        
        /* Popup Styling */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--white); padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .login-box button { background: var(--blue); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }

        header { background: var(--blue); color: var(--white); text-align: center; padding: 20px; }
        .container { max-width: 1200px; margin: auto; padding: 20px; display: none; }
        
        .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-top: 20px; }
        .service-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--blue); }
        .banner-box { background: var(--blue); height: 200px; display: flex; align-items: center; justify-content: center; color: white; position: relative; overflow: hidden; }
        .banner-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .banner-text { position: absolute; font-weight: bold; font-size: 1.2rem; text-align: center; padding: 10px; }
        
        .content { padding: 15px; text-align: center; }
        .content h3 { color: var(--blue); margin: 10px 0; }
        .content p { font-size: 14px; color: #555; height: 50px; }

        .btn-group { display: flex; justify-content: space-around; padding: 15px; background: #f1f1f1; }
        .btn { padding: 10px 15px; border-radius: 5px; text-decoration: none; color: white; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .call { background: #007bff; }
        .whatsapp { background: #25d366; }
        .book { background: var(--blue); }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--blue)">స్వాగతం!</h2>
        <p>ముందుగా మీ వివరాలు నమోదు చేయండి</p>
        <input type="text" id="userName" placeholder="మీ పేరు" required>
        <input type="tel" id="userPhone" placeholder="మొబైల్ నంబర్" required>
        <button onclick="startSite()">వెబ్సైట్ చూడండి</button>
    </div>
</div>

<header>
    <h1>DHU Multi Manpower Services</h1>
    <p>నమ్మకమైన సేవలకు నిలువుటద్దం</p>
</header>

<div class="container" id="mainContent">
    <div class="service-grid" id="services">
        </div>
</div>

<script>
    const wpNumber = "918008859934";
    const callNumber = "9989719934";
    let userData = { name: '', phone: '' };

    function startSite() {
        const name = document.getElementById('userName').value;
        const phone = document.getElementById('userPhone').value;
        if(name && phone) {
            userData.name = name;
            userData.phone = phone;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadServices();
        } else { alert("దయచేసి వివరాలు నింపండి"); }
    }

    const services = [
        { id: 1, title: "మంత్లీ బేసిక్ డ్రైవర్", desc: "నమ్మకమైన మరియు అనుభవజ్ఞులైన డ్రైవర్లు నెలవారీ ప్రాతిపదికన అందుబాటులో కలరు.", img: "డ్రైవర్ యూనిఫామ్ వేసుకుని కార్ పక్కన నిలబడినట్టు" },
        { id: 2, title: "గంటల/రోజువారి డ్రైవర్", desc: "4 గంటలు, 8 గంటలు లేదా రోజంతా డ్రైవర్ సేవలు లభించును.", img: "డ్రైవర్ కస్టమర్‌కు స్వాగతం చెప్తున్నట్టు" },
        { id: 3, title: "హౌస్ కీపింగ్", desc: "మీ ఇంటిని శుభ్రంగా ఉంచడానికి శిక్షణ పొందిన పనివారు.", img: "మహిళ ఇంటిని శుభ్రం చేస్తున్నట్టు" },
        { id: 4, title: "వాచ్‌మెన్ సేవలు", desc: "ఇళ్ల వద్ద మరియు అపార్ట్‌మెంట్‌ల వద్ద భార్యాభర్తలు వాచ్‌మెన్ సేవలు అందిస్తారు.", img: "భార్యాభర్త ఇంట్లో పనిచేస్తున్నట్టు" },
        { id: 5, title: "ఆఫీస్ బాయ్", desc: "ఆఫీస్ స్టాఫ్ కు టీ, కాఫీ మరియు ఇతర పనుల సహాయం కోసం.", img: "ఆఫీస్ లో కాఫీ అందిస్తున్నట్టు" },
        { id: 6, title: "కుకింగ్ సేవలు", desc: "రుచికరమైన మరియు శుభ్రమైన వంటలు చేయడానికి అనుభవజ్ఞులైన లేడీస్.", img: "మహిళ వంట చేస్తున్నట్టు" },
        { id: 7, title: "బేబీ కేర్ & ముసలివారి సేవలు", desc: "చిన్న పిల్లల మరియు వృద్ధుల సంరక్షణ కోసం ప్రత్యేక సిబ్బంది.", img: "బాబును చూసుకుంటున్నట్టు" },
        { id: 8, title: "సెక్యూరిటీ సర్వీసెస్", desc: "మీ ఆస్తి రక్షణ కోసం యూనిఫామ్డ్ సెక్యూరిటీ గార్డ్స్.", img: "సెక్యూరిటీ గార్డ్" },
        { id: 9, title: "రియల్ ఎస్టేట్ డీల్స్", desc: "ప్లాట్లు మరియు ఇళ్ల కొనుగోలు, అమ్మకాలలో నమ్మకమైన సేవలు.", img: "ప్రాపర్టీ డీల్స్" }
    ];

    function loadServices() {
        const grid = document.getElementById('services');
        services.forEach(s => {
            grid.innerHTML += `
                <div class="service-card">
                    <div class="banner-box">
                        <div class="banner-text">${s.title} Banner</div>
                    </div>
                    <div class="content">
                        <h3>${s.title}</h3>
                        <p>${s.desc}</p>
                    </div>
                    <div class="btn-group">
                        <a href="tel:${callNumber}" class="btn call"><i class="fas fa-phone"></i> Call</a>
                        <a href="https://wa.me/${wpNumber}?text=నేను ${s.title} బుక్ చేయాలనుకుంటున్నాను. నా పేరు: ${userData.name}, ఫోన్: ${userData.phone}" target="_blank" class="btn whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                        <a href="https://wa.me/${wpNumber}?text=BOOKING REQUEST: ${s.title}%0AUser: ${userData.name}%0APhone: ${userData.phone}" class="btn book"><i class="fas fa-check"></i> Book Now</a>
                    </div>
                </div>`;
        });
    }
</script>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
